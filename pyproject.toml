[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remi"
version = "0.1.0"
description = "TUI MIDI sampler — low-latency drum pad over PS4 controller"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5,<3",
    "textual>=0.85,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
strict = true
python_version = "3.12"
